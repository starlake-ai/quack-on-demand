{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "qod.fullname" . }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qod.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "qod.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # REST/UI + FlightSQL edge. Empty ingressFrom = allow from anywhere
    # (e.g. already gated by an Ingress / LoadBalancer upstream).
    # A NetworkPolicy matches the POD's port, so these name the container
    # ports (deployment.yaml), never the Service ports, which may differ.
    - ports:
        - protocol: TCP
          port: rest-ui
        - protocol: TCP
          port: flightsql
        - protocol: TCP
          port: quack
        {{- if .Values.rest.enabled }}
        - protocol: TCP
          port: rest-data
        {{- end }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Node pods' verdict and credential calls (POST /api/internal/authz/*), whatever ingressFrom
    # restricts: the listener authenticates every call with the node's key.
    - from:
        - podSelector:
            matchLabels:
              managed-by: quack-on-demand
      ports:
        - protocol: TCP
          port: 20901
  egress:
    # Spawned Quack node pods' HTTP endpoints. Tracks
    # manager.k8s.podLabel, see the nodes NetworkPolicy for details.
    - to:
        - podSelector:
            matchLabels:
              managed-by: quack-on-demand
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.nodePortRange.from }}
          endPort: {{ .Values.networkPolicy.nodePortRange.to }}
    # Postgres (control plane + DuckLake catalogs)
    - to:
        {{- if .Values.networkPolicy.postgres.cidr }}
        - ipBlock:
            cidr: {{ .Values.networkPolicy.postgres.cidr }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgres.port }}
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.smtp.enabled }}
    # Outbound SMTP (hosted signup / notification flow)
    - to:
        {{- if .Values.networkPolicy.smtp.cidr }}
        - ipBlock:
            cidr: {{ .Values.networkPolicy.smtp.cidr }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.smtp.port }}
    {{- end }}
{{- end }}
