{{- include "qod.validateValues" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qod.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qod.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if gt (.Values.replicaCount | int) 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "qod.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qod.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Force a rolling restart on Secret / ConfigMap content change so
        # env-var updates land without operator intervention.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if or (not .Values.postgres.existingSecret) .Values.postgres.password }}
        checksum/postgres-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "qod.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ add (.Values.drainTimeoutSec | int) 15 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "qod.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: rest-ui
              containerPort: 20900
              protocol: TCP
            # Nodes' verdict and credential calls: they reach this pod directly, so no Service.
            - name: internal
              containerPort: 20901
              protocol: TCP
            - name: flightsql
              containerPort: 31338
              protocol: TCP
            - name: quack
              containerPort: 9494
              protocol: TCP
            - name: rest-data
              containerPort: 31339
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "qod.fullname" . }}
          env:
            - name: QOD_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "qod.postgresPasswordSecretName" . | quote }}
                  key:  {{ include "qod.postgresPasswordSecretKey" . | quote }}
            # Always set: qod.validateValues requires admin.password or admin.existingSecret.
            - name: QOD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "qod.adminPasswordSecretName" . | quote }}
                  key:  {{ include "qod.adminPasswordSecretKey" . | quote }}
            # Pod injects its own namespace + name so the K8s backend can scope
            # pod create/list calls correctly even when default-ns differs.
            - name: QOD_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # This replica's own address: with QOD_INTERNAL_URL unset the manager tells its nodes to
            # call http://<pod IP>:20901 for verdicts (IPv6 in brackets), so the replica that minted
            # a handle, not the Service, answers.
            - name: QOD_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: QOD_INTERNAL_PORT
              value: "20901"
            {{- if not (hasKey (.Values.env | default dict) "JAVA_OPTS") }}
            - name: JAVA_OPTS
              value: {{ .Values.javaOpts | quote }}
            {{- end }}
            {{- if and .Values.auth.keycloak.enabled .Values.auth.keycloak.existingSecret }}
            - name: QOD_AUTH_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.keycloak.existingSecret | quote }}
                  key:  {{ .Values.auth.keycloak.existingSecretKey | default "keycloakClientSecret" | quote }}
            {{- end }}
            {{- if and (eq (.Values.auth.management.identitySource | default "db") "oidc") .Values.auth.management.oidc.existingSecret }}
            - name: QOD_MGMT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.management.oidc.existingSecret | quote }}
                  key:  {{ .Values.auth.management.oidc.existingSecretKey | default "mgmtOidcClientSecret" | quote }}
            {{- end }}
            {{- if eq (include "qod.s3Enabled" .) "true" }}
            - name: QOD_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "qod.s3SecretName"   . | quote }}
                  key:  {{ include "qod.s3AccessKeyKey" . | quote }}
            - name: QOD_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "qod.s3SecretName"   . | quote }}
                  key:  {{ include "qod.s3SecretKeyKey" . | quote }}
            {{- end }}
            {{- if .Values.flightsql.tls.existingSecret }}
            # The FlightSQL edge's pair, from flightsql.tls.existingSecret; the native front door
            # reuses it when quack.tls.enabled is true.
            - name: PROXY_TLS_CERT_CHAIN
              value: {{ include "qod.flightTlsCertPath" . | quote }}
            - name: PROXY_TLS_PRIVATE_KEY
              value: {{ include "qod.flightTlsKeyPath" . | quote }}
            - name: QOD_QUACK_TLS_CERT_CHAIN
              value: {{ include "qod.flightTlsCertPath" . | quote }}
            - name: QOD_QUACK_TLS_PRIVATE_KEY
              value: {{ include "qod.flightTlsKeyPath" . | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: QOD_DRAIN_TIMEOUT_SEC
              value: {{ .Values.drainTimeoutSec | quote }}
            - name: QOD_POOL_DRAIN_TIMEOUT_SEC
              value: {{ .Values.poolDrainTimeoutSec | quote }}
            {{- if gt (.Values.replicaCount | int) 1 }}
            - name: QOD_HA_ENABLED
              value: "true"
            {{- end }}
            {{- with include "qod.sessionJwtSecretName" . }}
            - name: QOD_SESSION_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: sessionJwtSecret
            {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          livenessProbe:
            httpGet:
              path: /health
              port: rest-ui
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds:       {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds:      {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold:    {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /ready
              port: rest-ui
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds:       {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds:      {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold:    {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.flightsql.tls.existingSecret .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.flightsql.tls.existingSecret }}
            - name: flight-tls
              mountPath: {{ include "qod.flightTlsDir" . | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.flightsql.tls.existingSecret .Values.extraVolumes }}
      volumes:
        {{- if .Values.flightsql.tls.existingSecret }}
        # Only the two keys, under fixed names: kubelet refuses to start the pod when either key
        # is missing from the Secret. Mode 0440 reads through the pod's fsGroup.
        - name: flight-tls
          secret:
            secretName: {{ .Values.flightsql.tls.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ required "flightsql.tls.certKey is required with flightsql.tls.existingSecret" .Values.flightsql.tls.certKey | quote }}
                path: cert.pem
              - key: {{ required "flightsql.tls.keyKey is required with flightsql.tls.existingSecret" .Values.flightsql.tls.keyKey | quote }}
                path: key.pem
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}