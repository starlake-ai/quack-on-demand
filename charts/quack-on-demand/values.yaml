# ============================================================================
# quack-on-demand chart values
# ============================================================================
#
# Reference for every knob the manager honors. Anything under `env:` is passed
# through to the manager pod verbatim as QOD_* / PROXY_* env vars and
# overrides the corresponding key in application.conf. See the project's
# guides/RUNNING.md for the full env-var table.

# --- Image ------------------------------------------------------------------
image:
  repository: starlakeai/quack-on-demand
  tag: ""                  # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent
imagePullSecrets: []

# --- Replicas ---------------------------------------------------------------
# replicaCount > 1 turns on HA mode (QOD_HA_ENABLED=true): active-active
# replicas with Postgres advisory-lock leader election. Every replica signs
# sessions with the same secret: sessionJwtSecret when set, else the one the
# first manager stored in the control-plane database.
# See docs/superpowers/specs/2026-07-02-manager-ha-zero-downtime-design.md.
replicaCount: 1

# Optional override for the rendered names. `fullnameOverride` wins if set.
nameOverride: ""
fullnameOverride: ""

# --- Service accounts and RBAC ----------------------------------------------
serviceAccount:
  create: true
  name: ""                 # defaults to the release fullname
  annotations: {}

rbac:
  # Manager calls the K8s API to create/watch/delete pods + services in its
  # own namespace (KubernetesQuackBackend). A Role is sufficient; never
  # ClusterRole.
  create: true

# --- Pod-level ---------------------------------------------------------------
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false   # JVM writes to /tmp and the manager auto-generates TLS certs at runtime

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 4Gi

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
# Seconds the manager waits for in-flight statements before shutting down.
# terminationGracePeriodSeconds is derived as drainTimeoutSec + 15 so Kubernetes
# never SIGKILLs a still-draining manager. Raise for long-running queries.
drainTimeoutSec: 60

# --- Services (REST/UI + FlightSQL) -----------------------------------------
service:
  # Admin REST + UI listener
  rest:
    type: ClusterIP
    port: 20900
    annotations: {}
  # FlightSQL edge (gRPC). Default ClusterIP. To expose externally, switch
  # to LoadBalancer / NodePort, OR front it with a Gateway / Envoy.
  flightsql:
    type: ClusterIP
    port: 31338
    # Pin a NodePort (30000-32767) when type=NodePort; empty = let k8s assign.
    nodePort: ""
    annotations: {}
  # Native Quack protocol front door (plain HTTP, or TLS when quack.tls.enabled):
  # what a DuckDB client ATTACHes to. Any HTTP Ingress can front it. When
  # replicaCount > 1 the balancer in front MUST be session-sticky: Quack
  # sessions are per-replica, like FlightSQL sessions.
  quack:
    type: ClusterIP
    port: 9494
    nodePort: ""
    annotations: {}

# --- Ingress (REST/UI only - FlightSQL is gRPC and not handled here) --------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: quack.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# --- Probes ------------------------------------------------------------------
probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# --- ServiceMonitor (Prometheus Operator) -----------------------------------
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# --- PodDisruptionBudget -----------------------------------------------------
# Only created when replicaCount > 1 - single-manager deploys have no peer
# to fail over to.
pdb:
  enabled: true
  minAvailable: 1

# --- NetworkPolicy (opt-in) ---------------------------------------------------
# Off by default so existing clusters are unaffected. Flip to true to lock
# down traffic to/from the manager and the spawned Quack node pods to just
# what the control plane actually needs.
networkPolicy:
  enabled: false
  # Ports the manager assigns to spawned Quack node pods (LocalQuackBackend /
  # KubernetesQuackBackend). Matches manager.k8s.nodePortRange.
  nodePortRange:
    from: 21900
    to: 22500
  # External Postgres reachable from both the manager and every node pod.
  postgres:
    cidr: ""                # empty = allow the destination port to any address
    port: 5432
  # Object store (S3 / GCS / R2 / Azure Blob) DuckLake reads/writes parquet
  # to. Empty cidrs = allow 443 everywhere (tighten in prod to your storage
  # provider's published IP ranges).
  objectStore:
    cidrs: []
  # Peers allowed to reach the manager's REST/UI (20900) and FlightSQL
  # (31338) ports. Empty = allow from anywhere (e.g. behind an Ingress /
  # LoadBalancer already restricting access upstream). Node pods always reach
  # 20900 for their verdict calls, whatever this says.
  ingressFrom: []
  # Outbound SMTP for the hosted signup/notification flow. Off by default.
  smtp:
    enabled: false
    cidr: ""                # empty = allow the destination port to any address
    port: 587
  # Raw NetworkPolicy egress rules appended verbatim (toYaml) to the node
  # policy, for anything the values contract above doesn't cover.
  extraEgress: []

# --- Postgres (external) -----------------------------------------------------
# The manager and the spawned Quack nodes all talk to this Postgres for the
# DuckLake catalog + qodstate_* control-plane tables. Production deploys
# should point at a managed Postgres (RDS / Cloud SQL / AlloyDB / Azure DB).
postgres:
  host: ""                 # REQUIRED - e.g. "rds.example.com" or "postgres.svc"
  port: 5432
  # REQUIRED, no default. Every DuckLake catalog created without its own
  # credentials inherits this login, and each node holds it (as a file of its
  # secrets volume) to attach its catalog. A node user who obtains it reaches
  # the control-plane database and every other tenant's catalog; when it is a
  # Postgres superuser it also reaches the server itself (COPY ... TO PROGRAM,
  # pg_read_file). Use a dedicated non-superuser role that owns the control-
  # plane database and can create the catalog databases, e.g.:
  #   CREATE ROLE qod LOGIN CREATEDB PASSWORD '...';
  #   CREATE DATABASE qod OWNER qod;
  user: ""
  # Control-plane database name. Holds the qodstate_* tables. Per-tenant
  # DuckLake catalog databases (`${tenant}_${tenantDb}`, e.g. `tpch_tpch1`)
  # live next to it on the same Postgres server.
  dbName: qod
  # Postgres schema for the control-plane tables. Maps to QOD_PG_SCHEMA.
  schema: main
  # Pick exactly ONE secret strategy:
  #   1. inline password (dev / kind only - discouraged for prod)
  #   2. existing secret reference (recommended)
  password: ""             # DEV ONLY: inline plaintext, rendered into a Secret by the chart
  existingSecret: ""       # PROD: reference an externally-managed Secret containing the key below
  existingSecretKey: pgPassword

# --- Quack node image --------------------------------------------------------
# Image used for the Quack node pods the manager spawns. This is the DuckDB
# Quack server, NOT the manager - they're separate processes. Built from
# docker/quack-node/Dockerfile in this repo.
quackNode:
  # Published image on Docker Hub. Empty (the default) resolves to
  # `starlakeai/quack-on-demand-node:<appVersion>` - the node image released
  # in lockstep with the manager (release.yml publishes both since 0.6.1),
  # so a versioned chart deploys versioned images throughout. Override with
  # a full image ref to pin something else; `:latest-snapshot` is the moving
  # alias updated on every push to main that touches docker/quack-node/**.
  image: ""

# --- DuckLake storage --------------------------------------------------------
# Path the DuckLake catalog persists for parquet files. The same string is
# used by the manager-side loader and by every spawned Quack node, so it
# must be reachable from both. Default is `s3://qod-ducklake/qod-test`
# against the `s3:` block below - set s3.endpoint to your object store
# (SeaweedFS in the kind smoke; MinIO, real S3, R2, etc. elsewhere).
# Override to a filesystem path only when the manager and the node pods
# share a mount (rare in K8s; common in docker-compose).
storage:
  dataPath: s3://qod-ducklake/qod-test

# --- Object-store credentials (S3-compatible) -------------------------------
# Used when storage.dataPath starts with `s3://` (or s3a/r2). The chart renders
# these into the manager's defaultMetastore env vars, which KubernetesQuackBackend
# then forwards into every spawned Quack node pod (the credentials as files of
# the node's read-only secrets volume, never env vars). The node's
# spawn-quack-node.sh consumes `QOD_S3_*` to emit `CREATE SECRET qod_data_s3 (...)`,
# scoped to each database's data path (no node holds an unscoped S3 secret), so
# httpfs can talk to the endpoint; without the keys it uses the pod's AWS
# credential chain.
#
# For the kind smoke, defaults match charts/quack-on-demand/local-stack-k8s/seaweedfs.yaml.
# For production: point endpoint at your bucket (https://s3.<region>.amazonaws.com
# for real AWS S3), set useSsl=true, and use an existingSecret rather than the
# inline accessKey/secretKey.
s3:
  endpoint: "http://seaweedfs:8333"
  region: us-east-1
  urlStyle: path     # "path" for SeaweedFS/MinIO/R2; "vhost" for real S3
  useSsl: false
  # Inline creds (dev / kind only). Prefer existingSecret in production.
  accessKey: "quack"
  secretKey: "quackquack"
  existingSecret: ""
  existingSecretAccessKeyKey: s3AccessKey
  existingSecretSecretKeyKey: s3SecretKey

# --- Admin credentials -------------------------------------------------------
# REQUIRED: admin.password or admin.existingSecret (the chart refuses to render
# without one). The chart passes no static API key (there is no `apiKey` value
# any more, and the chart refuses one): people log in (the UI, `qod login`) and
# automation uses personal access tokens minted from a session
# (`qod auth pat create`), so without an admin nobody could ever log in.
#
# The admin user(s) are seeded into qodstate_user on first boot only (a row
# that already exists is never rewritten, so changing the password here and
# re-deploying does NOT rotate it: use `qod auth change-password`, or
# `qod admin reset-password` with database access). `username` accepts a
# comma-separated list: every entry gets the same password + admin role.
# Default seeds BOTH the project's documented convention
# (`admin@localhost.local`) AND the short form (`admin`) so operators can log
# in with either.
admin:
  username: "admin@localhost.local,admin"
  # Either inline (dev) or via an externally-managed secret (prod), which holds
  # the password under existingSecretKey.
  password: ""
  existingSecret: ""
  existingSecretKey: adminPassword

# Session JWT signing key (QOD_SESSION_JWT_SECRET). Optional at any replica
# count: left empty, the first manager generates one, stores it in the
# control-plane database and every restart and replica reads it, so sessions
# survive restarts. Set it (openssl rand -hex 32) only when another service
# must verify the sessions with the same key. To rotate the stored one, run
# DELETE FROM qodstate_boot_secret WHERE name = 'session_jwt'
# and restart every replica: every session and reset link ends.
sessionJwtSecret: ""
# Name of a pre-existing Secret with key "sessionJwtSecret" (takes precedence).
existingSessionJwtSecret: ""

# --- FlightSQL edge auth / TLS ---------------------------------------------
# Native Quack protocol front door (DuckDB clients). TLS off by default: the
# DuckDB client only speaks plain HTTP to loopback hosts; remote clients default
# to TLS, so enable it (the Flight edge's PEM pair is reused) or terminate TLS
# at an Ingress before exposing the port beyond the cluster.
quack:
  enabled: true
  tls:
    enabled: false

flightsql:
  tls:
    enabled: true
    # Leave both empty to let the manager auto-generate a self-signed cert at
    # boot (saved under /tmp/certs inside the pod). For real deployments,
    # mount a Secret containing the chain + key.
    existingSecret: ""
    certKey: server-cert.pem
    keyKey: server-key.pem

# --- OIDC auth providers ----------------------------------------------------
# Off by default; turn on to layer a Keycloak (or other OIDC) provider into
# the AuthenticationService chain alongside the built-in Basic / DB auth.
# Both authenticate the same FlightSQL session; the manager picks the first
# one that accepts the credentials presented.
#
# NOTE: this block governs the FlightSQL DATA PLANE. To drive admin-UI SSO
# (the /ui/ login), that is a separate, provider-agnostic switch:
#   - set auth.management.identitySource=oidc (env QOD_MGMT_IDENTITY_SOURCE)
#   - set auth.management.oidc.{issuerUrl,clientId,clientSecret} (env
#     QOD_MGMT_OIDC_ISSUER_URL / _CLIENT_ID / _CLIENT_SECRET); endpoints are
#     resolved via OIDC Discovery so any compliant IdP works
#   - set QOD_MGMT_PUBLIC_BASE_URL and register
#     ${QOD_MGMT_PUBLIC_BASE_URL}/api/auth/oidc/callback as a redirect URI
# See https://docs.starlake.ai/qod/operating/auth-providers ("Admin UI single sign-on").
auth:
  keycloak:
    enabled: false
    baseUrl:  "http://keycloak:8080"
    realm:    "qod"
    clientId: "qod-flightsql"
    # Expected token issuer override. Empty = derive from baseUrl + realm. Set
    # when Keycloak's browser-facing issuer (KC_HOSTNAME_URL behind an ingress)
    # differs from the in-cluster baseUrl used for JWKS, so bearer tokens minted
    # via the ingress validate. JWKS is always fetched from baseUrl.
    issuer: ""
    # Inline secret for dev/kind. Prefer existingSecret for production so the
    # value never lands in the ConfigMap.
    clientSecret: ""
    existingSecret: ""
    existingSecretKey: keycloakClientSecret

  # --- Management plane (admin UI) identity ---------------------------------
  # identitySource "db" (default) keeps the username/password/tenant form.
  # Set to "oidc" to make /ui/ a pure OIDC SSO client (provider-agnostic via
  # OIDC Discovery). When oidc, set oidc.issuerUrl/clientId/clientSecret and
  # publicBaseUrl, and register ${publicBaseUrl}/api/auth/oidc/callback on the
  # IdP client. See https://docs.starlake.ai/qod/operating/auth-providers.
  management:
    identitySource: "db"           # "db" | "oidc"
    publicBaseUrl: ""              # externally visible manager URL (redirect_uri base)
    oidc:
      issuerUrl: ""                # e.g. https://idp.example.com/realms/qod
      clientId: ""
      scopes: "openid email profile"
      # Inline secret for dev/kind. Prefer existingSecret for production.
      clientSecret: ""
      existingSecret: ""
      existingSecretKey: mgmtOidcClientSecret

# --- Metrics sink -----------------------------------------------------------
# One of: "prometheus" | "aws" | "azure" | "gcp" | "none". Defaults to
# "prometheus" so /metrics is exposed on the REST service.
metrics:
  sink: prometheus

# --- Demo bootstrap -------------------------------------------------------
# Setting loadTpc.enabled=true seeds the bundled demo manifest (acme +
# globex tenants, full RO/RW/DDL/ALL verb matrix, group-attached role
# chains). The image already contains the YAML at the classpath root, so
# no file mount is needed. The loaders are NOT run from the chart; use
# the local-stack-k8s harness for that.
loadTpc:
  enabled: false

# --- Arbitrary env-var passthrough ------------------------------------------
# Anything under `env` lands as an env var on the manager pod, taking
# precedence over the chart's own templating. Use this for QOD_* knobs
# the chart doesn't model explicitly yet.
env: {}

# --- Extra volume mounts (for cert secrets, custom config, etc.) ------------
extraVolumes: []
extraVolumeMounts: []