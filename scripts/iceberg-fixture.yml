# Local + CI fixture for the Iceberg REST end-to-end specs.
#
#   docker compose -f scripts/iceberg-fixture.yml up -d --wait
#   docker compose -f scripts/iceberg-fixture.yml down -v
#
# The REST fixture is UNAUTHENTICATED, which is why the end-to-end specs use
# authType = none. oauth2 / token / sigv4 rendering is unit-tested instead, in
# IcebergSetupSqlSpec.
#
# The MinIO images come from quay.io, not Docker Hub: the docker.io/minio/minio
# and docker.io/minio/mc repositories no longer serve pinned RELEASE.* tags
# ("pull access denied ... repository does not exist"), while quay.io still does.
# Tags stay pinned so a CI run and a local run drive the same fixture.
services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin password &&
      mc mb --ignore-existing local/warehouse &&
      mc anonymous set public local/warehouse
      "

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.0
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
