databaseChangeLog:
  - changeSet:
      id: 0049-boot-secret
      author: qod
      changes:
        # Boot secrets the manager generates once when its configuration leaves them unset, read
        # by every later boot and every HA replica. Row `session_jwt`: the session JWT signing
        # secret when QOD_SESSION_JWT_SECRET is unset (a configured value is never written here).
        # Deleting the row and restarting every replica rotates it, ending every session and
        # every outstanding password-reset link.
        - createTable:
            tableName: qodstate_boot_secret
            columns:
              - column: { name: name, type: text, constraints: { primaryKey: true, nullable: false } }
              - column: { name: value, type: text, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, defaultValueComputed: "now()", constraints: { nullable: false } }
