databaseChangeLog:
  - changeSet:
      id: 0048-tenant-auth-client-secret
      author: qod
      changes:
        # The tenant's own OIDC client secret for admin-console SSO, write-only (responses expose
        # only whether it is set). Bound to the issuerUrl in auth_config it was saved with: the
        # store writes the two in one statement
        # (docs/superpowers/specs/2026-10-24-tenant-signin-isolation-design.md).
        - addColumn:
            tableName: qodstate_tenant
            columns:
              - column:
                  name: auth_client_secret
                  type: text
        # Park every clientSecretRef stored before this changeset: its author is not recorded,
        # and a reference names a secret of the manager's own environment, which from now on only
        # a superuser may point a tenant at. Nothing reads the parked key; boot logs one ERROR per
        # tenant holding it (ParkedSecretRefs) until a write stores a secret source again (a
        # superuser restoring the reference, or the tenant's own client secret), which drops the
        # parked key. auth_config is JSONB since 0001. The key test is "-> ... IS NOT NULL", not
        # the jsonb "?" operator: Liquibase runs every raw statement through the driver's
        # Connection.nativeSQL, which rewrites a "?" into the bind marker "$1" (a syntax error).
        - sql:
            sql: >
              UPDATE qodstate_tenant
                 SET auth_config = (auth_config - 'clientSecretRef')
                     || jsonb_build_object('clientSecretRefUnconfirmed', auth_config -> 'clientSecretRef')
               WHERE auth_config -> 'clientSecretRef' IS NOT NULL
