databaseChangeLog:
  - changeSet:
      id: 0028-user-must-change-password
      author: qod
      changes:
        # Set by an admin at user create / password reset time to mark the
        # assigned password as temporary: DatabaseAuthenticator refuses it on
        # both the REST login and the FlightSQL handshake until the user swaps
        # it via POST /api/auth/change-password (which clears the flag).
        # Default false so every pre-existing row keeps logging in unchanged.
        - addColumn:
            tableName: qodstate_user
            columns:
              - column:
                  name: must_change_password
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
