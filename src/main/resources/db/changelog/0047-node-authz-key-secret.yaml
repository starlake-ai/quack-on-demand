databaseChangeLog:
  - changeSet:
      id: 0047-node-authz-key-secret
      author: qod
      changes:
        # The node-key secret every node key derives from (in-engine authorization) when
        # QOD_NODE_KEY_SECRET is unset: one row, written by the first manager that boots and read
        # by every replica and restart, so the nodes a manager adopts keep accepting its session
        # handles. Rotating it means restarting every node.
        - createTable:
            tableName: qodstate_node_authz
            columns:
              - column: { name: id, type: smallint, constraints: { primaryKey: true, nullable: false } }
              - column: { name: key_secret, type: text, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, defaultValueComputed: "now()", constraints: { nullable: false } }
        - sql:
            sql: ALTER TABLE qodstate_node_authz ADD CONSTRAINT qodstate_node_authz_one_row CHECK (id = 1)
