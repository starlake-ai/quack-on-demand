databaseChangeLog:
  - changeSet:
      id: 0060-delete-orphan-tenant-users
      author: qod
      changes:
        # Issue #265: until this release, deleting a tenant left its users in qodstate_user
        # (qodstate_user.tenant has no foreign key to qodstate_tenant). PoolSupervisor.deleteTenant
        # now deletes them; this removes the ones earlier deletes left, keyed on the tenant id the
        # column holds. ON DELETE CASCADE takes their role and group memberships, pool permissions,
        # personal access tokens and S3 credentials. Superusers (tenant IS NULL) are untouched.
        - sql:
            sql: >
              DELETE FROM qodstate_user u
              WHERE u.tenant IS NOT NULL
                AND NOT EXISTS (SELECT 1 FROM qodstate_tenant t WHERE t.id = u.tenant)
