databaseChangeLog:
  - changeSet:
      id: 0052-user-s3-credential
      author: qod
      changes:
        # Each user's own S3 credentials (in-engine authorization, decision 23): a non-superuser
        # reaches an s3:// location only under one of their own scopes, signed with those keys.
        # scope is stored normalized: s3://<bucket>/ or s3://<bucket>/<prefix>/
        # (UserS3CredentialRules). A node receives a user's rows as connection secrets
        # qod_uc_<first 8 of id> of that user's connections only, fetched from the manager
        # (POST /api/internal/authz/credentials), never through a node secret file. A replace keeps
        # the row's id and moves updated_at, which session handles digest.
        - createTable:
            tableName: qodstate_user_s3_credential
            columns:
              - column: { name: id,                type: TEXT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id,           type: TEXT, constraints: { nullable: false, foreignKeyName: fk_qodstate_user_s3_credential_user, references: 'qodstate_user(id)', deleteCascade: true } }
              - column: { name: scope,             type: TEXT, constraints: { nullable: false } }
              - column: { name: access_key_id,     type: TEXT, constraints: { nullable: false } }
              - column: { name: secret_access_key, type: TEXT, constraints: { nullable: false } }
              - column: { name: session_token,     type: TEXT }
              - column: { name: region,            type: TEXT }
              - column: { name: endpoint,          type: TEXT }
              - column: { name: url_style,         type: TEXT }
              - column: { name: created_at,        type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: "NOW()", constraints: { nullable: false } }
              - column: { name: updated_at,        type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: "NOW()", constraints: { nullable: false } }
        - sql:
            sql: "ALTER TABLE qodstate_user_s3_credential ADD CONSTRAINT qodstate_user_s3_credential_id_check CHECK (id ~ '^[0-9a-f]{32}$')"
        - addUniqueConstraint:
            tableName:      qodstate_user_s3_credential
            columnNames:    user_id, scope
            constraintName: qodstate_user_s3_credential_user_scope_unique
  - changeSet:
      id: 0052-user-s3-credential-policy-version
      author: qod
      changes:
        # A credential change moves its user's tenant's policy version, so a cached allow of a COPY
        # to a URL a removed credential covered does not outlive it. 0050's function learns one
        # more way to reach a tenant, through the row's user: a superuser's row (tenant NULL) bumps
        # nothing, and neither does the cascade of a deleted user (the user row is gone by then; its
        # own delete bumped the tenant).
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION qod_bump_policy_version() RETURNS trigger
              LANGUAGE plpgsql AS $$
              DECLARE
                images JSONB[] := '{}';
                image JSONB;
                tenants TEXT[] := '{}';
                t TEXT;
              BEGIN
                IF TG_OP IN ('UPDATE', 'DELETE') THEN
                  images := array_append(images, to_jsonb(OLD));
                END IF;
                IF TG_OP IN ('INSERT', 'UPDATE') THEN
                  images := array_append(images, to_jsonb(NEW));
                END IF;
                FOREACH image IN ARRAY images LOOP
                  CASE TG_ARGV[0]
                    WHEN 'tenant_id' THEN
                      t := image ->> 'tenant_id';
                    WHEN 'tenant' THEN
                      t := image ->> 'tenant';
                    WHEN 'role_id' THEN
                      SELECT tenant_id INTO t FROM qodstate_role WHERE id = image ->> 'role_id';
                    WHEN 'group_id' THEN
                      SELECT tenant_id INTO t FROM qodstate_group WHERE id = image ->> 'group_id';
                    WHEN 'user_id' THEN
                      SELECT tenant INTO t FROM qodstate_user WHERE id = image ->> 'user_id';
                  END CASE;
                  IF t IS NOT NULL THEN
                    tenants := array_append(tenants, t);
                  END IF;
                END LOOP;
                UPDATE qodstate_tenant SET policy_version = nextval('qodstate_policy_version_seq')
                WHERE id = ANY(tenants);
                RETURN NULL;
              END;
              $$
        - sql:
            sql: CREATE TRIGGER qod_policy_version_ins_del AFTER INSERT OR DELETE ON qodstate_user_s3_credential FOR EACH ROW EXECUTE FUNCTION qod_bump_policy_version('user_id')
        - sql:
            sql: CREATE TRIGGER qod_policy_version_upd AFTER UPDATE ON qodstate_user_s3_credential FOR EACH ROW WHEN (OLD.* IS DISTINCT FROM NEW.*) EXECUTE FUNCTION qod_bump_policy_version('user_id')
