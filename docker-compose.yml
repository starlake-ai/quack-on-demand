# docker-compose.yml - local quack-on-demand stack
#
# Two services:
#   - postgres : control-plane DB `qod` (qodstate_* tables) + every
#                tenant-db (`${tenant}_${tenantDb}`, e.g. `tpch_tpch1`)
#                the manager provisions; DuckLake `__ducklake_*`
#                metadata lives inside each tenant-db.
#   - quack    : the manager (REST + UI + FlightSQL edge) built from ./Dockerfile
#
# All persistent state is bind-mounted onto the host. Each host path
# defaults to a repo-relative folder but accepts an EXTERNAL override (env
# var, absolute or relative) so the data can live off the repo on a
# dedicated disk / NFS mount:
#   ./pgdata          -> postgres data dir   (`qod` + every tenant-db)   [PGDATA_DIR]
#   ./ducklake        -> DuckLake data files (parquet, one subdir per db) [DUCKLAKE_DIR]
#   ./certs           -> self-signed TLS cert + key (auto-gen first boot)  [CERTS_DIR]
#   ./rustfs          -> RustFS object data   (rustfs profile)          [RUSTFS_DIR]
#
# NOTE: `NUKE=1 scripts/run-docker-compose.sh` only wipes the repo-relative
# defaults; external folders you point these vars at are left untouched.
#
# Settings live in `.env` (or env vars at compose time) - see .env.example.
# Bring everything up with:
#   docker compose up --build

services:

  postgres:
    image: postgres:16-alpine
    container_name: quack-on-demand-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-azizam}
      POSTGRES_DB:       ${PG_DBNAME:-qod}
    ports:
      # Exposed on the host so external tools (psql, DBeaver) can also reach
      # the metastore. Comment out for a tighter container-only network.
      - "${PG_PORT:-5432}:5432"
    volumes:
      # Host path defaults to ./pgdata (repo-relative) but can point at an
      # EXTERNAL folder - e.g. PGDATA_DIR=/data/qod/pgdata - so the metastore
      # lives off the repo on a dedicated disk. Absolute or relative both work.
      - ${PGDATA_DIR:-./pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DBNAME:-qod}"]
      interval: 5s
      timeout:  3s
      retries:  20

  quack:
    build:
      context: .
      dockerfile: Dockerfile
      # HTTP_PROXY / HTTPS_PROXY / NO_PROXY (and lowercase) are BuildKit
      # predefined args: declaring them here automatically exposes the
      # values to RUN inside the Dockerfile, so apt-get + curl behind a
      # corporate proxy work without touching the Dockerfile. Empty
      # defaults make them no-ops on non-proxied hosts.
      args:
        HTTP_PROXY:  ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY:    ${NO_PROXY:-}
        http_proxy:  ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy:    ${no_proxy:-}
      # Same host-gateway alias the runtime uses, so the build container
      # can reach a host-loopback proxy (cntlm/squid) after the URL
      # rewrite in scripts/run-docker-compose.sh.
      extra_hosts:
        - "host.docker.internal:host-gateway"
    # Single image name for both flows: `docker compose up --build` writes
    # this tag locally; `docker compose pull` fetches it from Docker Hub.
    # Pin to a specific snapshot/release via QOD_VERSION (e.g.
    # QOD_VERSION=0.1.0 docker compose pull). Through the wrapper script,
    # QOD_VERSION=BUILD builds and runs the :local tag instead.
    image: starlakeai/quack-on-demand:${QOD_VERSION:-latest}
    container_name: quack-on-demand
    restart: unless-stopped
    # The manager registers a JVM shutdown hook that drains in-flight
    # FlightSQL statements (`quack-on-demand.drainTimeoutSec`, default
    # 60s) before SIGTERMing the child Quack node processes. 75s gives
    # the drain a comfortable margin before Docker escalates to SIGKILL.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    # Deliberately does NOT depends_on rustfs/rustfs-mb: `quack` carries no
    # profile (it must come up on a plain `docker compose up`), and a
    # depends_on toward a profiled service is not honored from a
    # profile-less one - compose would refuse to start rustfs-mb for it at
    # all, breaking the default (no S3) run. When the rustfs profile is
    # active and QOD_DUCKLAKE_DATA_PATH points at s3://, the bucket-exists
    # race against the manager's boot-time DuckLake init is instead closed
    # by run-docker-compose.sh, which waits for rustfs-mb to exit 0 after
    # `up` and before the manager-readiness wait. A raw `docker compose
    # --profile rustfs up -d` (bypassing the wrapper) does not get that
    # wait and can race it.
    environment:
      # ----- Postgres connection (the service name is the hostname) -----
      QOD_PG_HOST:     postgres
      QOD_PG_PORT:     "5432"
      QOD_PG_USER:     ${PG_USER:-postgres}
      QOD_PG_PASSWORD: ${PG_PASSWORD:-azizam}
      QOD_PG_DBNAME:   ${PG_DBNAME:-qod}
      QOD_PG_SCHEMA:   ${PG_SCHEMA:-main}

      # DuckLake "data root" the manager bakes into per-tenant-db
      # catalogs. The supervisor derives each tenant-db's path as
      # `dirname($QOD_DUCKLAKE_DATA_PATH)/<tenantDb-name>` (matches
      # PoolSupervisor.effectiveMetastoreFor's convention), so with the
      # demo seed `acme/acme_tpch` lands at `/app/ducklake/acme_tpch`
      # and `globex/globex_tpcds` at `/app/ducklake/globex_tpcds`.
      # The value here is the GLOBAL default; the leaf segment is just
      # an anchor and is NOT a real tenant-db.
      #
      # Honor a user-supplied override (.env / shell) so switching to
      # `s3://...` storage works without editing this file.
      QOD_DUCKLAKE_DATA_PATH: ${QOD_DUCKLAKE_DATA_PATH:-/app/ducklake/data}

      # Demo bootstrap manifest. run-docker-compose.sh writes this to
      # .env when LOAD_TPC is set so the JVM imports the bundled YAML
      # (which lives inside the assembly jar). Operators with custom
      # manifests can point this at a host file mounted into the
      # container.
      QOD_BOOTSTRAP_YAML: ${QOD_BOOTSTRAP_YAML:-}

      # ----- Auth + TLS toggles (defaults match a fast smoke test) -----
      QOD_AUTH_DB_ENABLED: ${AUTH:-true}
      QOD_ADMIN_USERNAME:  ${ADMIN_USERNAME:-admin}
      QOD_ADMIN_PASSWORD:  ${ADMIN_PASSWORD:-admin}
      QOD_API_KEY:         ${API_KEY:-}
      PROXY_TLS_ENABLED:        ${TLS:-false}

      # ----- Local-mode Quack node port range -----
      QOD_MIN_PORT: "${QUACK_MIN_PORT:-21900}"
      QOD_MAX_PORT: "${QUACK_MAX_PORT:-22500}"

      # ----- DuckLake on S3-compatible object storage (optional) -----
      # When QOD_DUCKLAKE_DATA_PATH starts with s3:// (or gs://, az://,
      # azure://, abfss://), spawn-quack-node.sh + load-tpch-dbgen.sh skip
      # the local mkdir and configure DuckDB's httpfs/azure extensions via
      # CREATE SECRET so DuckLake reads/writes parquet directly against the
      # bucket. Leave QOD_DUCKLAKE_DATA_PATH at its filesystem default
      # to keep using the ./ducklake bind-mount; set it to s3://bucket/path
      # (or s3a://, etc.) to switch to object storage.
      #
      # The bundled `rustfs` profile (docker compose --profile rustfs
      # up -d) brings up a single-node RustFS exposing an S3 API at
      # rustfs:9000 and creates the bucket named by S3_BUCKET (RustFS does
      # not auto-create buckets on PutObject, so a one-shot rustfs-mb
      # service creates it first). Pair it with
      # QOD_DUCKLAKE_DATA_PATH=s3://${S3_BUCKET}/<db>, point
      # QOD_S3_ENDPOINT at rustfs:9000, and the stack runs end-to-end
      # without touching ./ducklake. For external S3 (AWS, R2, MinIO, GCS
      # HMAC) leave the profile off and fill in the endpoint + credentials.
      QOD_S3_ENDPOINT:          ${QOD_S3_ENDPOINT:-}
      QOD_S3_ACCESS_KEY_ID:     ${QOD_S3_ACCESS_KEY_ID:-}
      QOD_S3_SECRET_ACCESS_KEY: ${QOD_S3_SECRET_ACCESS_KEY:-}
      QOD_S3_REGION:            ${QOD_S3_REGION:-us-east-1}
      QOD_S3_URL_STYLE:         ${QOD_S3_URL_STYLE:-path}
      QOD_S3_USE_SSL:           ${QOD_S3_USE_SSL:-false}

      # ----- Corporate proxy passthrough (optional) -----
      # Forward host proxy env vars into the container so DuckDB extension
      # downloads (extensions.duckdb.org) and any other outbound HTTP from
      # the manager + child Quack nodes go through the corporate proxy.
      # Each var defaults to empty; compose only sets it when it has a
      # value, so non-proxied environments are unaffected.
      #
      # Bundled in-network hostnames are always added to NO_PROXY so the
      # manager/seeder/Quack nodes reach `postgres` and `rustfs:9000`
      # directly. Without this, libcurl in DuckDB's httpfs routes the
      # s3:// PUTs through the corporate proxy and they come back as
      # 407 Proxy Authentication Required / 502 Bad Gateway.
      HTTP_PROXY:  ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY:    "localhost,127.0.0.1,postgres,rustfs${NO_PROXY:+,${NO_PROXY}}"
      http_proxy:  ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy:    "localhost,127.0.0.1,postgres,rustfs${no_proxy:+,${no_proxy}}"

    ports:
      - "${MANAGER_PORT:-20900}:20900"   # REST + UI
      - "${EDGE_PORT:-31338}:31338"      # FlightSQL edge
      - "${QUACK_MIN_PORT:-21900}-${QUACK_MAX_PORT:-22500}:${QUACK_MIN_PORT:-21900}-${QUACK_MAX_PORT:-22500}"

    # Make the host reachable as `host.docker.internal` so a corporate
    # proxy listening on the host's loopback (e.g. cntlm at 127.0.0.1:3128)
    # is reachable from inside the container. No-op on macOS/Windows where
    # the name already resolves; needed on Linux where it does not.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Disable IPv6 inside the container. Docker's default bridge network
    # doesn't route IPv6, but the embedded DNS resolver still returns AAAA
    # records for hosts like extensions.duckdb.org - connection then times
    # out trying to reach an unreachable IPv6 address. Forcing v4-only
    # makes the resolver skip AAAA and DuckDB's httpfs reaches the CDN.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1

    volumes:
      # DuckLake parquet + TLS certs. Host paths default to ./ducklake and
      # ./certs (repo-relative) but accept EXTERNAL folders via DUCKLAKE_DIR /
      # CERTS_DIR (e.g. DUCKLAKE_DIR=/data/qod/ducklake). Absolute or relative.
      - ${DUCKLAKE_DIR:-./ducklake}:/app/ducklake
      - ${CERTS_DIR:-./certs}:/app/certs

  # ----- Optional: RustFS as an in-compose S3 backend -----
  #
  # Opt in with:
  #   docker compose --profile rustfs up -d
  #
  # RustFS (https://rustfs.com) is a single S3-compatible object-store
  # binary - no separate master/volume/filer processes, so the whole
  # store is one container. The S3 API listens on :9000; the manager +
  # quack nodes reach it as `rustfs:9000` on the compose network, and
  # host clients can hit it on the same port. A web console (RustFS's
  # equivalent of SeaweedFS's Filer UI file browser) listens on :9001.
  #
  # Persistence: ./rustfs on the host (bind-mount), same pattern as the
  # postgres/ducklake/certs volumes.
  #
  # Credentials are plain env vars (RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY)
  # - no config file to pre-seed, unlike SeaweedFS's s3.json. Defaults
  # match the QOD_S3_* env vars on the quack service. Override
  # S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY / S3_BUCKET in .env if you
  # change them.
  #
  # The image runs as the non-root user rustfs (uid/gid 10001), so the
  # bind mount must be writable by that uid. run-docker-compose.sh
  # pre-creates and chowns ./rustfs to 10001:10001 (via an ephemeral
  # container, the same trick it uses for ./ducklake and ./certs) on every
  # invocation, not just NUKE - Docker would otherwise auto-create it
  # root-owned on first `up` and RustFS gets EACCES on /data. Bringing this
  # profile up with a raw `docker compose --profile rustfs up -d` (bypassing
  # the wrapper script) must mkdir + chown ./rustfs to 10001:10001 by hand
  # first.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: quack-on-demand-rustfs
    profiles: ["rustfs"]
    restart: unless-stopped
    user: "10001:10001"
    command:
      - /data
    environment:
      RUSTFS_ADDRESS:          ":9000"
      RUSTFS_ACCESS_KEY:       ${QOD_S3_ACCESS_KEY_ID:-quack}
      RUSTFS_SECRET_KEY:       ${QOD_S3_SECRET_ACCESS_KEY:-quackquack}
      RUSTFS_CONSOLE_ENABLE:   "true"
      RUSTFS_CONSOLE_ADDRESS:  ":9001"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
      # 9000 = S3 API. 9001 = web console (file browser + bucket UI).
      - "${RUSTFS_S3_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      # RustFS object data. Externalize with RUSTFS_DIR (default ./rustfs).
      - ${RUSTFS_DIR:-./rustfs}:/data
    # No exec-based healthcheck here: the rustfs image is a minimal single
    # binary with no wget/curl to probe with, unlike SeaweedFS's
    # Debian-based image. The rustfs-mb service below establishes
    # readiness itself by retrying against the S3 API.

  # One-shot bucket bootstrap. Unlike SeaweedFS (which auto-created
  # buckets on first PUT), RustFS requires the bucket to exist before
  # DuckLake's catalog issues its first HeadBucket / PUT, so this creates
  # it explicitly before the quack manager starts touching the path. The
  # retry loop also stands in for the healthcheck rustfs itself doesn't have.
  rustfs-mb:
    image: amazon/aws-cli:2.22.35
    container_name: quack-on-demand-rustfs-mb
    profiles: ["rustfs"]
    depends_on:
      - rustfs
    environment:
      S3_BUCKET:             ${S3_BUCKET:-ducklake}
      AWS_ACCESS_KEY_ID:     ${QOD_S3_ACCESS_KEY_ID:-quack}
      AWS_SECRET_ACCESS_KEY: ${QOD_S3_SECRET_ACCESS_KEY:-quackquack}
      AWS_REGION:            ${QOD_S3_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-c"]
    # $$VAR escapes compose's variable substitution so the in-container shell
    # resolves these at runtime; a bare $VAR would be expanded by compose at
    # YAML-load time (against .env) and arrive empty - same trick the old
    # seaweedfs services used for their s3.json heredocs.
    command:
      - |
        set -eu
        ep=http://rustfs:9000
        for i in $$(seq 1 60); do
          if aws --endpoint-url "$$ep" s3api head-bucket --bucket "$${S3_BUCKET}" 2>/dev/null; then
            echo "bucket $${S3_BUCKET} already exists"; exit 0
          fi
          if aws --endpoint-url "$$ep" s3 mb "s3://$${S3_BUCKET}" 2>/dev/null; then
            echo "bucket $${S3_BUCKET} created"; exit 0
          fi
          echo "rustfs not ready yet ($$i/60); retrying..."; sleep 2
        done
        echo "rustfs never became ready" >&2; exit 1

  # --- Prometheus + Grafana (observability profile) ------------------------
  # Optional. Bring up with
  #   docker compose --profile observability up -d
  # alongside (or without) the rustfs profile. Configs come from
  # `observability/`, mounted read-only. Grafana is anonymous-admin so the
  # dashboard is reachable without a login - DON'T expose the port to a
  # public network without flipping that off.
  #
  # Standalone variant (against a native-jar manager on the host) lives at
  # `observability/docker-compose.yml`; this one scrapes the in-network
  # `quack` service directly.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: quack-on-demand-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      quack:
        condition: service_started
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:10.4.5
    container_name: quack-on-demand-grafana
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # Anonymous admin so the dashboard opens without a login prompt.
      # Switch off for any deployment that isn't on a private host.
      GF_AUTH_ANONYMOUS_ENABLED:     "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE:    Admin
      GF_AUTH_DISABLE_LOGIN_FORM:    "true"
      GF_USERS_DEFAULT_THEME:        light
    volumes:
      - ./observability/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana-dashboard-single.json:/var/lib/grafana/dashboards/quack-on-demand.json:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:

# --- RustFS console ------------------------------------------------------------
# The `rustfs` profile's `rustfs` service exposes a web console on
# http://localhost:${RUSTFS_CONSOLE_PORT:-9001}/ (RUSTFS_CONSOLE_ENABLE=true
# above) - that page is a file browser (buckets/keys, download links),
# RustFS's equivalent of SeaweedFS's Filer UI. No extra container needed.
# It logs in with the same RUSTFS_ACCESS_KEY/RUSTFS_SECRET_KEY as the S3 API
# (${QOD_S3_ACCESS_KEY_ID:-quack} / ${QOD_S3_SECRET_ACCESS_KEY:-quackquack} by
# default) - DON'T expose this port to a public network without changing them,
# same caution as Grafana's anonymous-admin port above.
#
# S3 API for `aws s3 ls` / `s5cmd ls` / `mc ls`:
#   http://localhost:${RUSTFS_S3_PORT:-9000}    creds: ${QOD_S3_ACCESS_KEY_ID:-quack} / ${QOD_S3_SECRET_ACCESS_KEY:-quackquack}

# TPC-H seeding is done by `docker compose exec quack /app/scripts/load-tpch-dbgen.sh`
# (driven by scripts/run-docker-compose.sh when LOAD_TPCH is set). The loader is
# baked into the image (see Dockerfile) and sees the same /app/ducklake bind-mount
# the manager spawns nodes against, so the absolute DATA_PATH the catalog persists
# matches what nodes later resolve. No separate compose service required.
#
# When using the rustfs profile, set QOD_DUCKLAKE_DATA_PATH=s3://${S3_BUCKET}/<db>
# (and QOD_S3_ENDPOINT=rustfs:9000) so the same loader writes parquet
# to the bucket instead of /app/ducklake. The path the catalog persists is the
# s3:// URL, which every Quack node resolves identically regardless of host.
#
# run-docker-compose.sh's demo-seed execs follow suit automatically: whenever
# QOD_S3_ENDPOINT is set (environment or .env - a real env var wins, matching
# compose's own `${VAR}` interpolation), each loader's DATA_PATH is derived as
# s3://${S3_BUCKET}/<db> (matching what the manager's bootstrap import already
# created the DuckLake catalog at) instead of the /app/ducklake/<db> default,
# and the QOD_S3_* credentials are forwarded into the exec so the loader can
# author the same DuckDB S3 SECRET. TEMP_DIR always stays local regardless -
# spill must never go to the bucket.